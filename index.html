<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habit Tracker</title>
<style>
  :root {
    --bg: #fdf5f7;
    --ink: #5c2a3a;
    --muted: #a97b8a;
    --line: #f0dce2;
    --card: #ffffff;
    --lvl0: #fbeef1;
    --lvl1: #f3c1cf;
    --lvl2: #e589a3;
    --lvl3: #c94f76;
    --lvl4: #7a1f3d;
    --accent: #c94f76;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-size: 32px;
    text-align: center;
    margin: 0 0 4px;
    color: var(--accent);
  }
  .sub {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 20px;
  }
  .toolbar {
    display: flex;
    gap: 10px;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  button, input[type="text"] {
    font-family: inherit;
    font-size: 13px;
  }
  .btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 9px 16px;
    cursor: pointer;
    font-weight: 600;
  }
  .btn.secondary {
    background: #fff;
    color: var(--accent);
    border: 1px solid var(--accent);
  }
  .btn:disabled { opacity: 0.5; cursor: default; }
  #newHabitInput {
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    outline: none;
    min-width: 160px;
  }
  #status {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    min-height: 18px;
    margin-bottom: 10px;
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 8px;
    box-shadow: 0 4px 20px rgba(122, 31, 61, 0.08);
    overflow-x: auto;
  }
  table {
    border-collapse: separate;
    border-spacing: 4px;
    width: 100%;
  }
  th, td {
    text-align: center;
    vertical-align: middle;
  }
  th.habit-col-header, td.habit-name {
    text-align: left;
    position: sticky;
    left: 0;
    background: var(--card);
    z-index: 2;
    padding: 6px 12px 6px 4px;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    white-space: nowrap;
    min-width: 130px;
  }
  th.date-col {
    font-size: 11px;
    color: var(--muted);
    font-weight: 600;
    padding-bottom: 6px;
    white-space: nowrap;
  }
  .cell {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    background: var(--lvl0);
    border: 1px solid var(--line);
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
    padding: 0;
  }
  .cell:hover { transform: scale(1.08); }
  .cell.l1 { background: var(--lvl1); border-color: var(--lvl1); }
  .cell.l2 { background: var(--lvl2); border-color: var(--lvl2); }
  .cell.l3 { background: var(--lvl3); border-color: var(--lvl3); }
  .cell.l4 { background: var(--lvl4); border-color: var(--lvl4); }
  .legend {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 16px;
    font-size: 12px;
    color: var(--muted);
    flex-wrap: wrap;
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend .swatch { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
  .empty-msg { text-align: center; color: var(--muted); padding: 30px; font-size: 14px; }
  #setupBanner {
    background: #fff3cd;
    border: 1px solid #ffe08a;
    color: #7a5c00;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
  }

  /* Past Days overview grid */
  .past-days-section { margin-bottom: 28px; }
  .past-days-label {
    font-size: 12px;
    letter-spacing: 0.12em;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .past-days-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 12px;
  }
  .day-card {
    background: var(--card);
    border-radius: 12px;
    padding: 12px;
    box-shadow: 0 2px 10px rgba(122, 31, 61, 0.06);
  }
  .day-card .day-label {
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 4px;
  }
  .day-card .day-pct {
    font-size: 17px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 8px;
  }
  .day-card .day-bar {
    height: 4px;
    border-radius: 2px;
    background: var(--line);
    overflow: hidden;
  }
  .day-card .day-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
  }
  @media (max-width: 900px) {
    .past-days-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  }
  @media (max-width: 520px) {
    .past-days-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Habit Tracker</h1>

  <div id="setupBanner">
    ⚠️ Set <code>SCRIPT_URL</code> at the top of the &lt;script&gt; section in this file to your deployed
    Google Apps Script web app URL before this will load or save any data.
  </div>

  <div id="status"></div>

  <div class="past-days-section">
    <div class="past-days-label">Past Days</div>
    <div class="past-days-grid" id="pastDaysHost"></div>
  </div>

  <div class="card">
    <div id="tableHost"></div>
  </div>

  <div class="legend">
    <span><span class="swatch" style="background:var(--lvl0);border:1px solid var(--line)"></span>0%</span>
    <span><span class="swatch" style="background:var(--lvl1)"></span>25%</span>
    <span><span class="swatch" style="background:var(--lvl2)"></span>50%</span>
    <span><span class="swatch" style="background:var(--lvl3)"></span>75%</span>
    <span><span class="swatch" style="background:var(--lvl4)"></span>100%</span>
  </div>
</div>

<script>
// ============================================================
// PASTE YOUR DEPLOYED APPS SCRIPT WEB APP URL HERE:
const SCRIPT_URL = "PASTE_YOUR_WEB_APP_URL_HERE";
// ============================================================

let state = { habits: [], dates: [], data: {} };

function todayStr() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function prettyDate(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return dt.toLocaleDateString(undefined, { day: '2-digit', month: 'short' });
}

function setStatus(msg, isError) {
  const el = document.getElementById('status');
  el.textContent = msg || '';
  el.style.color = isError ? '#c0392b' : 'var(--muted)';
}

async function loadData() {
  if (!SCRIPT_URL || SCRIPT_URL.indexOf('PASTE_YOUR') === 0) {
    document.getElementById('setupBanner').style.display = 'block';
    return;
  }
  setStatus('Loading…');
  try {
    const res = await fetch(SCRIPT_URL, { method: 'GET' });
    const json = await res.json();
    state = json;
    // sort dates descending (newest first)
    state.dates.sort((a, b) => (a < b ? 1 : a > b ? -1 : 0));
    ensureTodayColumn(); // auto-add today's column without needing a button
    render();
    setStatus('');
  } catch (err) {
    setStatus('Could not load from Google Sheets: ' + err.message, true);
  }
}

async function saveValue(dateStr, habit, value) {
  setStatus('Saving…');
  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ date: dateStr, habit: habit, value: value })
    });
    setStatus('Saved ✓');
    setTimeout(() => setStatus(''), 1200);
  } catch (err) {
    setStatus('Save failed: ' + err.message, true);
  }
}

function ensureTodayColumn() {
  const t = todayStr();
  if (!state.dates.includes(t)) {
    state.dates.unshift(t);
    state.dates.sort((a, b) => (a < b ? 1 : a > b ? -1 : 0));
    state.data[t] = {};
    state.habits.forEach(h => state.data[t][h] = 0);
  }
}

function cycleCell(dateStr, habit) {
  const current = (state.data[dateStr] && state.data[dateStr][habit]) || 0;
  const next = (current + 1) % 5;
  if (!state.data[dateStr]) state.data[dateStr] = {};
  state.data[dateStr][habit] = next;
  render();
  saveValue(dateStr, habit, next);
}

function levelClass(v) {
  return v > 0 ? 'l' + v : '';
}

function dayPercent(dateStr) {
  if (!state.habits.length) return 0;
  const dayData = state.data[dateStr] || {};
  let total = 0;
  state.habits.forEach(h => { total += (dayData[h] || 0); });
  const max = state.habits.length * 4;
  return max ? Math.round((total / max) * 100) : 0;
}

function renderPastDays() {
  const host = document.getElementById('pastDaysHost');
  if (!host) return;
  let html = '';
  state.dates.forEach(d => {
    const pct = dayPercent(d);
    html += `
      <div class="day-card">
        <div class="day-label">${prettyDate(d)}</div>
        <div class="day-pct">${pct}%</div>
        <div class="day-bar"><div class="day-bar-fill" style="width:${pct}%"></div></div>
      </div>`;
  });
  host.innerHTML = html;
}

function render() {
  renderPastDays();
  const host = document.getElementById('tableHost');
  if (!state.habits.length && !state.dates.length) {
    host.innerHTML = '<div class="empty-msg">No data yet. Add a habit column to your Google Sheet to get started.</div>';
    return;
  }

  let html = '<table><thead><tr><th class="habit-col-header">Habit</th>';
  state.dates.forEach(d => {
    html += `<th class="date-col">${prettyDate(d)}</th>`;
  });
  html += '</tr></thead><tbody>';

  state.habits.forEach(habit => {
    html += `<tr><td class="habit-name">${escapeHtml(habit)}</td>`;
    state.dates.forEach(d => {
      const v = (state.data[d] && state.data[d][habit]) || 0;
      html += `<td><button class="cell ${levelClass(v)}" data-date="${d}" data-habit="${escapeAttr(habit)}"></button></td>`;
    });
    html += '</tr>';
  });

  html += '</tbody></table>';
  host.innerHTML = html;

  host.querySelectorAll('.cell').forEach(btn => {
    btn.addEventListener('click', () => {
      cycleCell(btn.dataset.date, btn.dataset.habit);
    });
  });
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

loadData();
// keep the sheet and app in sync automatically
setInterval(loadData, 60000);
</script>
</body>
</html>
