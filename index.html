<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Habit Tracker</title>
<style>
  :root {
    --bg: #fdf1f4;
    --card: #ffffff;
    --ink: #5c2233;
    --ink-soft: #9c6b7a;
    --border: #f4dce3;
    --accent: #c02f68;

    --tier-0: #f7e9ee;
    --tier-25: #eeaac2;
    --tier-50: #dd6f95;
    --tier-90: #c02f68;
    --tier-100: #6f1533;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px 16px 64px;
  }

  .wrap {
    max-width: 1100px;
    margin: 0 auto;
  }

  header.page-header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 20px;
  }

  h1 {
    font-size: 1.5rem;
    margin: 0;
    letter-spacing: 0.02em;
  }

  .sub {
    color: var(--ink-soft);
    font-size: 0.85rem;
    margin-top: 2px;
  }

  .header-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  a.btn, button.btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--card);
    color: var(--accent);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.85rem;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
  }

  a.btn:hover, button.btn:hover { background: #fff5f8; }

  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 1px 2px rgba(92, 34, 51, 0.06);
  }

  /* Connect panel */
  #connectPanel input[type=text] {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 0.9rem;
    margin: 10px 0;
  }

  #connectPanel p { font-size: 0.85rem; color: var(--ink-soft); line-height: 1.5; }
  #connectPanel code { background: #fdf1f4; padding: 1px 5px; border-radius: 4px; }

  #status { font-size: 0.85rem; color: var(--ink-soft); margin-bottom: 10px; }
  #status.error { color: #b3261e; }

  /* Legend */
  .legend {
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
    font-size: 0.78rem;
    color: var(--ink-soft);
    margin-top: 4px;
  }
  .legend .swatch {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .legend .sq {
    width: 14px; height: 14px; border-radius: 4px;
  }

  /* Grid */
  .grid-scroll {
    overflow-x: auto;
    padding-bottom: 4px;
  }

  table.heatmap {
    border-collapse: separate;
    border-spacing: 4px;
  }

  table.heatmap th, table.heatmap td {
    text-align: center;
  }

  table.heatmap th.habit-name, table.heatmap td.habit-name {
    text-align: left;
    position: sticky;
    left: 0;
    background: var(--card);
    z-index: 2;
    padding-right: 12px;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    white-space: nowrap;
  }

  table.heatmap th.date-col {
    font-size: 0.68rem;
    font-weight: 600;
    color: var(--ink-soft);
    white-space: nowrap;
    padding-bottom: 6px;
  }

  .cell {
    width: 26px;
    height: 26px;
    border-radius: 7px;
    background: var(--tier-0);
    cursor: default;
  }

  /* Past days */
  .past-days-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 14px;
    margin-top: 14px;
  }

  .day-card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
  }

  .day-card .date { font-size: 0.8rem; color: var(--ink-soft); margin-bottom: 4px; }
  .day-card .pct { font-size: 1.3rem; font-weight: 700; margin-bottom: 8px; }
  .bar-track { background: var(--tier-0); border-radius: 6px; height: 6px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); border-radius: 6px; }

  .section-title {
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 4px;
  }

  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 8px;
  }

  select#daysLimit {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 0.8rem;
    color: var(--ink);
    background: #fff;
  }

  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">

  <header class="page-header">
    <div>
      <h1>Habit Tracker</h1>
      <div class="sub" id="lastUpdated">Not connected yet</div>
    </div>
    <div class="header-actions">
      <a class="btn" id="sheetLink" href="#" target="_blank" rel="noopener">Open Google Sheet ↗</a>
      <button class="btn" id="refreshBtn">Refresh</button>
    </div>
  </header>

  <div class="card" id="connectPanel" hidden>
    <div class="section-title">Connect your sheet</div>
    <p>
      Paste the Apps Script <b>Web app URL</b> you got after deploying <code>Code.gs</code>
      (Deploy → New deployment → Web app → copy the URL ending in <code>/exec</code>).
      This is saved in this browser only.
    </p>
    <input type="text" id="urlInput" placeholder="https://script.google.com/macros/s/XXXXX/exec" />
    <button class="btn" id="saveUrlBtn">Connect</button>
    <p id="connectError" style="color:#b3261e;"></p>
  </div>

  <div class="card" id="dataArea" hidden>
    <div id="status"></div>

    <div class="grid-scroll">
      <table class="heatmap" id="heatmapTable"></table>
    </div>

    <div class="legend" id="legend"></div>
  </div>

  <div class="card" id="pastDaysCard" hidden>
    <div class="controls">
      <div class="section-title">Past days</div>
      <select id="daysLimit">
        <option value="21">Last 21 days</option>
        <option value="30">Last 30 days</option>
        <option value="60">Last 60 days</option>
        <option value="99999">All time</option>
      </select>
    </div>
    <div class="past-days-grid" id="pastDaysGrid"></div>
  </div>

</div>

<script>
  // ---------------------------------------------------------------------
  // CONFIG — paste your deployed Apps Script Web app URL below (ends in
  // /exec). If you leave it blank, the page will ask for it and remember
  // it in this browser instead.
  // ---------------------------------------------------------------------
  var CONFIG = {
    APPS_SCRIPT_URL: "",
    SHEET_URL: "https://docs.google.com/spreadsheets/d/1TacVXg8QW09OYAVp9x09mltvGGxwGPu3L0ZsbelUQ1U/edit?gid=0#gid=0"
  };

  var TIERS = [
    { max: 25,  color: "var(--tier-0)",   label: "0%"   },
    { max: 50,  color: "var(--tier-25)",  label: "25%"  },
    { max: 90,  color: "var(--tier-50)",  label: "50%"  },
    { max: 100, color: "var(--tier-90)",  label: "90%"  },
    { max: Infinity, color: "var(--tier-100)", label: "100%" }
  ];

  function tierForPct(pct) {
    if (pct >= 100) return TIERS[4];
    if (pct >= 90)  return TIERS[3];
    if (pct >= 50)  return TIERS[2];
    if (pct >= 25)  return TIERS[1];
    return TIERS[0];
  }

  var els = {
    connectPanel: document.getElementById("connectPanel"),
    urlInput: document.getElementById("urlInput"),
    saveUrlBtn: document.getElementById("saveUrlBtn"),
    connectError: document.getElementById("connectError"),
    dataArea: document.getElementById("dataArea"),
    status: document.getElementById("status"),
    heatmapTable: document.getElementById("heatmapTable"),
    legend: document.getElementById("legend"),
    pastDaysCard: document.getElementById("pastDaysCard"),
    pastDaysGrid: document.getElementById("pastDaysGrid"),
    daysLimit: document.getElementById("daysLimit"),
    lastUpdated: document.getElementById("lastUpdated"),
    sheetLink: document.getElementById("sheetLink"),
    refreshBtn: document.getElementById("refreshBtn")
  };

  els.sheetLink.href = CONFIG.SHEET_URL;

  function getApiUrl() {
    return CONFIG.APPS_SCRIPT_URL || localStorage.getItem("habitTrackerApiUrl") || "";
  }

  function formatDateLabel(iso) {
    // iso = "yyyy-MM-dd", parse manually to avoid timezone shifting the day
    var parts = iso.split("-");
    var y = parseInt(parts[0], 10), m = parseInt(parts[1], 10), d = parseInt(parts[2], 10);
    var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return d + " " + months[m - 1];
  }

  function buildDayStats(payload) {
    var total = payload.habitNames.length;
    var stats = {}; // date -> {completed, pct, tier}
    payload.days.forEach(function (day) {
      var completed = 0;
      payload.habitNames.forEach(function (h) {
        if (day.habits[h]) completed++;
      });
      var pct = total > 0 ? (completed / total) * 100 : 0;
      stats[day.date] = {
        completed: completed,
        total: total,
        pct: pct,
        tier: tierForPct(pct)
      };
    });
    return stats;
  }

  function renderLegend() {
    var order = [TIERS[0], TIERS[1], TIERS[2], TIERS[3], TIERS[4]];
    els.legend.innerHTML = order.map(function (t) {
      return '<span class="swatch"><span class="sq" style="background:' + t.color + '"></span>' + t.label + "</span>";
    }).join("");
  }

  function renderHeatmap(payload, dayStats) {
    var days = payload.days.slice().sort(function (a, b) { return b.date < a.date ? -1 : 1; });
    var habitNames = payload.habitNames;

    var html = "<thead><tr><th class=\"habit-name\"></th>";
    days.forEach(function (day) {
      html += '<th class="date-col">' + formatDateLabel(day.date) + "</th>";
    });
    html += "</tr></thead><tbody>";

    habitNames.forEach(function (habit) {
      html += '<tr><td class="habit-name">' + escapeHtml(habit) + "</td>";
      days.forEach(function (day) {
        var done = !!day.habits[habit];
        var stat = dayStats[day.date];
        var color = done ? stat.tier.color : TIERS[0].color;
        var title = escapeHtml(habit) + " — " + formatDateLabel(day.date) + ": " +
          (done ? "done" : "not done") + " (day total " + Math.round(stat.pct) + "%)";
        html += '<td><div class="cell" style="background:' + color + '" title="' + title + '"></div></td>';
      });
      html += "</tr>";
    });

    html += "</tbody>";
    els.heatmapTable.innerHTML = html;
  }

  function renderPastDays(payload, dayStats) {
    var limit = parseInt(els.daysLimit.value, 10);
    var days = payload.days.slice().sort(function (a, b) { return b.date < a.date ? -1 : 1; });
    days = days.slice(0, limit);

    els.pastDaysGrid.innerHTML = days.map(function (day) {
      var stat = dayStats[day.date];
      var pct = Math.round(stat.pct);
      return (
        '<div class="day-card">' +
          '<div class="date">' + formatDateLabel(day.date) + '</div>' +
          '<div class="pct">' + pct + '%</div>' +
          '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>' +
        '</div>'
      );
    }).join("");
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function render(payload) {
    var dayStats = buildDayStats(payload);
    renderLegend();
    renderHeatmap(payload, dayStats);
    renderPastDays(payload, dayStats);
    els.dataArea.hidden = false;
    els.pastDaysCard.hidden = false;
    els.status.classList.remove("error");
    els.status.textContent = payload.habitNames.length + " habits · " + payload.days.length + " days tracked";
    var when = payload.generatedAt ? new Date(payload.generatedAt) : new Date();
    els.lastUpdated.textContent = "Updated " + when.toLocaleString();
  }

  function loadData() {
    var url = getApiUrl();
    if (!url) {
      els.connectPanel.hidden = false;
      els.dataArea.hidden = true;
      els.pastDaysCard.hidden = true;
      return;
    }
    els.connectPanel.hidden = true;
    els.status.classList.remove("error");
    els.status.textContent = "Loading…";
    els.dataArea.hidden = false;

    fetch(url)
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function (payload) {
        if (!payload || !payload.habitNames) throw new Error("Unexpected response shape");
        render(payload);
      })
      .catch(function (err) {
        els.status.classList.add("error");
        els.status.textContent =
          "Couldn't load data (" + err.message + "). Check that the Apps Script URL is correct and the " +
          "deployment access is set to \"Anyone\".";
      });
  }

  els.saveUrlBtn.addEventListener("click", function () {
    var val = els.urlInput.value.trim();
    if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(val)) {
      els.connectError.textContent = "That doesn't look like a Web app /exec URL — double-check it.";
      return;
    }
    els.connectError.textContent = "";
    localStorage.setItem("habitTrackerApiUrl", val);
    loadData();
  });

  els.refreshBtn.addEventListener("click", loadData);
  els.daysLimit.addEventListener("change", function () {
    var url = getApiUrl();
    if (!url) return;
    fetch(url).then(function (r) { return r.json(); }).then(function (payload) {
      renderPastDays(payload, buildDayStats(payload));
    });
  });

  // Prefill the connect box if a URL was saved before but CONFIG is empty
  (function initConnectBox() {
    var saved = localStorage.getItem("habitTrackerApiUrl");
    if (saved) els.urlInput.value = saved;
  })();

  loadData();
</script>
</body>
</html>
